name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
        if: runner.os == 'Linux'
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The build produced the app
        shell: bash
        run: test -f packages/desktop/out/main/index.cjs && test -f packages/desktop/out/renderer/index.html
